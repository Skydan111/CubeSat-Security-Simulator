<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warehouse Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a0f;
        --surface: #111118;
        --surface2: #18181f;
        --border: #2a2a35;
        --text: #e8e8f0;
        --muted: #6b6b80;
        --accent-temp: #ff6b35;
        --accent-hum: #00d4aa;
        --accent-press: #7b8cff;
        --alert: #ff3b5c;
        --ok: #00d4aa;
        --mono: "Space Mono", monospace;
        --sans: "DM Sans", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
      }

      .layout {
        display: grid;
        grid-template-rows: 60px 135px 260px 85px 110px;
        height: 100vh;
        padding: 22px 30px 14px;
        gap: 10px;
      }

      /* HEADER */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .header-left h1 {
        font-family: var(--mono);
        font-size: 0.95rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .header-left p {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 3px;
        font-family: var(--mono);
      }

      .live-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--ok);
        letter-spacing: 0.1em;
      }

      .header-status {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .status-date,
      .status-time {
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .live-dot {
        width: 7px;
        height: 7px;
        background: var(--ok);
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.8);
        }
      }

      /* METRIC CARDS */
      .metrics-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .metric-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
        position: relative;
        overflow: hidden;
      }

      .metric-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
      }

      .metric-card.temp::before {
        background: var(--accent-temp);
      }
      .metric-card.hum::before {
        background: var(--accent-hum);
      }
      .metric-card.press::before {
        background: var(--accent-press);
      }

      .metric-stats {
        margin-top: 8px;
        display: flex;
        gap: 12px;
        font-family: var(--mono);
        font-size: 0.6rem;
        color: var(--muted);
      }

      .metric-label {
        font-family: var(--mono);
        font-size: 0.6rem;
        color: var(--muted);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .metric-value {
        font-family: var(--mono);
        font-size: 1.55rem;
        font-weight: 700;
        line-height: 1;
      }

      .metric-card.temp .metric-value {
        color: var(--accent-temp);
      }
      .metric-card.hum .metric-value {
        color: var(--accent-hum);
      }
      .metric-card.press .metric-value {
        color: var(--accent-press);
      }

      .metric-unit {
        font-size: 0.8rem;
        color: var(--muted);
        margin-left: 3px;
      }

      .metric-status {
        margin-top: 6px;
        font-size: 0.65rem;
        font-family: var(--mono);
        color: var(--muted);
      }

      .metric-status.alert {
        color: var(--alert);
      }
      .metric-status.ok {
        color: var(--ok);
      }

      /* CHARTS */
      .charts-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        min-height: 0;
      }

      .chart-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .chart-title {
        font-family: var(--mono);
        font-size: 0.6rem;
        color: var(--muted);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 10px;
        flex-shrink: 0;
      }

      .chart-canvas-wrap {
        position: relative;
        flex: 1;
        min-height: 0;
        height: 100%;
      }

      /* ALERTS */
      .alerts-section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 18px;
        min-height: 0;
        overflow: hidden;
      }

      .section-title {
        font-family: var(--mono);
        font-size: 0.6rem;
        color: var(--muted);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      #alerts-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .alert-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: rgba(255, 59, 92, 0.08);
        border: 1px solid rgba(255, 59, 92, 0.25);
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--alert);
      }

      .no-alerts {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--ok);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* AI SECTION */
      .ai-section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 0;
        overflow: hidden;
      }

      .ai-left {
        flex-shrink: 0;
      }

      #ai-btn {
        background: transparent;
        border: 1px solid var(--accent-press);
        color: var(--accent-press);
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        padding: 7px 16px;
        border-radius: 4px;
        cursor: pointer;
        text-transform: uppercase;
        transition: all 0.2s;
        white-space: nowrap;
      }

      #ai-btn:hover {
        background: var(--accent-press);
        color: var(--bg);
      }

      #ai-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .ai-divider {
        width: 1px;
        height: 32px;
        background: var(--border);
        flex-shrink: 0;
      }

      #ai-output {
        font-family: var(--sans);
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.6;
      }

      #ai-output.active {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header>
        <div class="header-left">
          <h1>Warehouse Monitor</h1>
          <p id="last-update">Waiting for data...</p>
        </div>

        <div class="header-status">
          <div class="status-date" id="current-date">27 MAY 2026</div>

          <div class="status-time" id="current-time">14:37:12</div>

          <div class="live-badge">
            <div class="live-dot"></div>
            LIVE
          </div>
        </div>
      </header>

      <!-- CURRENT VALUES -->

      <div class="metrics-row">
        <div class="metric-card temp">
          <div class="metric-label">Temperature</div>
          <div class="metric-value" id="val-temp">
            —<span class="metric-unit">°C</span>
          </div>
          <div class="metric-status ok" id="status-temp">NOMINAL</div>
          <div class="metric-stats" id="stats-temp">—</div>
        </div>
        <div class="metric-card hum">
          <div class="metric-label">Humidity</div>
          <div class="metric-value" id="val-hum">
            —<span class="metric-unit">%</span>
          </div>
          <div class="metric-status ok" id="status-hum">NOMINAL</div>
          <div class="metric-stats" id="stats-hum">—</div>
        </div>
        <div class="metric-card press">
          <div class="metric-label">Pressure</div>
          <div class="metric-value" id="val-press">
            —<span class="metric-unit">hPa</span>
          </div>
          <div class="metric-status ok" id="status-press">NOMINAL</div>
          <div class="metric-stats" id="stats-press">—</div>
        </div>
      </div>

      <!-- CHARTS -->

      <div class="charts-row">
        <div class="chart-card">
          <div class="chart-title">Temperature / °C</div>
          <div class="chart-canvas-wrap">
            <canvas id="chart-temp"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Humidity / %</div>
          <div class="chart-canvas-wrap">
            <canvas id="chart-hum"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Pressure / hPa</div>
          <div class="chart-canvas-wrap">
            <canvas id="chart-press"></canvas>
          </div>
        </div>
      </div>

      <!-- ALERTS -->

      <div class="alerts-section">
        <div class="section-title">Alerts</div>
        <div id="alerts-list">
          <div class="no-alerts">✓ All parameters within range</div>
        </div>
      </div>

      <!-- AI ANALYSIS -->

      <div class="ai-section">
        <div class="ai-left">
          <div class="section-title" style="margin-bottom: 6px">
            AI Analysis
          </div>
          <button id="ai-btn">Analyse</button>
        </div>
        <div class="ai-divider"></div>
        <div id="ai-output">
          Press Analyse to generate an AI report of current telemetry.
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
